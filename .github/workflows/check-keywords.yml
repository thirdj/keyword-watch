name: Check Keywords

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Call check-keywords endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/check-keywords" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Keep workflow active
        uses: liskin/gh-workflow-keepalive@v1